worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    map $host $ssl_cert {
        default "$SSL_CERT_PATH";
    }

    map $host $ssl_key {
        default "$SSL_KEY_PATH";
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    server {
        listen 80;
        server_name 10books.win *.10books.win;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        server_name 10books.win;
        ssl_certificate     $ssl_cert;
        ssl_certificate_key $ssl_key;

        location / {
            proxy_pass http://10books-website:80;
            include /etc/nginx/proxy_params;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    server {
        listen 443 ssl;
        server_name releases.10books.win;
        client_max_body_size 100M;
        ssl_certificate     $ssl_cert;
        ssl_certificate_key $ssl_key;
        
        location / {
            proxy_pass http://10books-releases:8000;
            include /etc/nginx/proxy_params;
        }
    }

    server {
        listen 443 ssl;
        server_name listing-api.10books.win;
        client_max_body_size 5M;
        ssl_certificate     $ssl_cert;
        ssl_certificate_key $ssl_key;

        location / {
            proxy_pass http://10books-listing-api:8000;
            include /etc/nginx/proxy_params;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl;
        server_name books-api.10books.win;

        ssl_certificate     $ssl_cert;
        ssl_certificate_key $ssl_key;

        location / {
            proxy_pass http://10books-books-api:8000;
            include /etc/nginx/proxy_params;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl;
        server_name messaging-api.10books.win;
        client_max_body_size 5M;
        ssl_certificate     $ssl_cert;
        ssl_certificate_key $ssl_key;

        location /messaging/ws/ {
            proxy_pass http://10books-messaging-api:8000/messaging/ws/;
            include /etc/nginx/proxy_params;
            include /etc/nginx/proxy_params_websocket;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://10books-messaging-api:8000;
            include /etc/nginx/proxy_params;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_certificate     $ssl_cert;
        ssl_certificate_key $ssl_key;
        return 444;
    }
}
