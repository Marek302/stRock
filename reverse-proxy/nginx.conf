worker_processes auto;

events {
    worker_connections 1024;
}

http{
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 80;
        server_name localhost;
        location / {
            proxy_pass http://10books-website:80;
            include /etc/nginx/proxy_params;
        }
    }
    server {
        listen 80;
        server_name releases.localhost;
        client_max_body_size 100M;
        location / {
            proxy_pass http://10books-releases:8000;
            include /etc/nginx/proxy_params;
        }
    }
    server {
        listen 80;
        server_name listing-api.localhost;
        client_max_body_size 5M;
        location / {
            proxy_pass http://10books-listing-api:8000;
            include /etc/nginx/proxy_params;
        }
    }

    server {
        listen 80;
        server_name books-api.localhost;

        location / {
            proxy_pass http://10books-books-api:8000;
            include /etc/nginx/proxy_params;
        }
    }

    server {
        listen 80;
        server_name messaging-api.localhost;
        client_max_body_size 5M;
        location /messaging/ws/ {
            proxy_pass http://10books-messaging-api:8000/messaging/ws/;
            include /etc/nginx/proxy_params;
            include /etc/nginx/proxy_params_websocket;
        }

        location / {
            proxy_pass http://10books-messaging-api:8000;
            include /etc/nginx/proxy_params;
        }
    }
}
