worker_processes auto;

events {
    worker_connections 1024;
}

http{
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 80;
        server_name localhost;
        location /messaging/ {
            proxy_pass http://messaging-backend:8000;
            include /etc/nginx/proxy_params;
            include /etc/nginx/proxy_params_websocket;
        }
        location /api/v1/ {
            proxy_pass http://post-backend:8000;
            client_max_body_size 11M;
            include /etc/nginx/proxy_params;
        }
        location / {
            proxy_pass http://frontend:80;
            include /etc/nginx/proxy_params;
        }
    }
    server {
        listen 80;
        server_name post.localhost;
        client_max_body_size 11M;
        location / {
            proxy_pass http://post-backend:8000;
            include /etc/nginx/proxy_params;
        }
    }

    server {
        listen 80;
        server_name messaging.localhost;
        client_max_body_size 11M;
        location /messaging/ws/ {
            proxy_pass http://messaging-backend:8000/messaging/ws/;
            include /etc/nginx/proxy_params;
            include /etc/nginx/proxy_params_websocket;
        }

        location / {
            proxy_pass http://messaging-backend:8000;
            include /etc/nginx/proxy_params;
        }
    }
}
