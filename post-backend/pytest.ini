[pytest]
pythonpath = .
#J'ai enlevé ce warning, car c'est la dépendance en elle-même qui n'est pas à jour - Samuel Baribault
filterwarnings =
  ignore:.*@wait_container_is_ready.*:DeprecationWarning
#Les tests ne passent pas sans ça, car le script db.py regarde quand même pour les variables d'environnement - Samuel Baribault  
env =
    CONNECTION_STR=postgresql://user:pass@localhost:5432/placeholder
    PHOTO_SAVE_ROOT=.pytest_cache/test_uploads