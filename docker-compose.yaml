services:
  reverse-proxy:
    image: nginx:latest
    build:
      context: reverse-proxy
      dockerfile: Dockerfile
    container_name: rock-on-proxy
    ports:
      - "8080:80"
    networks:
      - frontend
      - rock-on-network
    restart: unless-stopped
    depends_on:
      - frontend
      - post-backend
      - messaging-backend

  frontend:
    image: nginx:alpine
    container_name: frontend
    env_file:
      - frontend/.env
    build:
      context: frontend
      dockerfile: Dockerfile
    networks:
      - frontend
    restart: unless-stopped

  post-backend:
    image: post-backend:latest
    build:
      context: ./post-backend
      dockerfile: Dockerfile.test
    container_name: post-backend
    env_file:
      - post-backend/.env
    networks:
      - rock-on-network
      - rock-on-post
    depends_on:
      post-db:
        condition: service_healthy
    restart: unless-stopped

  messaging-backend:
    image: messaging-backend:latest
    build:
      context: messaging-backend/
      dockerfile: Dockerfile
    container_name: messaging-backend
    env_file:
      - messaging-backend/.env
    networks:
      - rock-on-network
      - rock-on-messaging
    restart: unless-stopped
    depends_on:
      messaging-db:
        condition: service_healthy

  post-db:
    image: post-db:latest
    build:
      context: post-db
      dockerfile: Dockerfile
    container_name: post-db
    env_file:
      - post-db/.env
    networks:
      - rock-on-post
    restart: always

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$DB_USER -d $$DB_NAME"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  messaging-db:
    image: messaging-db:latest
    build:
      context: messaging-db
      dockerfile: Dockerfile
    container_name: messaging-db
    env_file:
      - messaging-db/.env
    networks:
      - rock-on-messaging
    restart: always

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  frontend:
  rock-on-network:
  rock-on-post:
  rock-on-messaging:
